<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KFC Menu</title>
</head>
<body>
    <h1>Welcome to the KFC Menu</h1>
    <p>Explore our restaurant items!</p>
    <a href="/about/">About us</a>

    <h2>Menu</h2>
    <ul>
    {% for item in items %}
        <li>
            <strong>{{ item.name }}</strong> - Rs {{ item.price }}
            <p>{{ item.description }}</p>
        </li>
    {% empty %}
        <li>No menu items available.</li>
    {% endfor %}
    </ul>
</body>
</html>
